[flake8]
max-line-length = 120
exclude = venv/, env/, .tox/, django_drip_campaigns.egg-info/, __pycache__, docs/, legacy_docs/, **/migrations/*.py
extend-ignore = E203, W503

[isort]
line_length = 120
known_first_party = drip,config
multi_line_output = 3
default_section = THIRDPARTY
skip = venv/, env/, .tox/, django_drip_campaigns.egg-info/, __pycache__, docs/, legacy_docs/
skip_glob = **/migrations/*.py
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

; [black]: black is configured in pyproject.toml, because it doesn't use this file

[mypy]
python_version = 3.12
check_untyped_defs = True
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
plugins = mypy_django_plugin.main
exclude = ^(venv|env|\.tox|django_drip_campaigns\.egg-info|__pycache__|.*/migrations|docs|legacy_docs)

[mypy.plugins.django-stubs]
django_settings_module = testsettings

[tool:pytest]
addopts = --ds=testsettings --reuse-db
python_files = tests.py test_*.py

[coverage:run]
include = drip/*
omit =
    */lib/*
    build/*
    dist/*
    __pycache__/*
    django_drip_campaigns.egg-info/*
    env-*
    env-django-drip/*
    *__pycache__*
    */migrations/*
    *__init__.py
    */virtualenv/*
    *tests*
plugins =
    django_coverage_plugin
