name: Django Drip Campaigns

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        include:
          # # python 3.5
          # - python-version: "3.5"
          #   django-version: "2.2"
          # python 3.6
          # - python-version: "3.6"
          #   django-version: "2.2"
          # - python-version: "3.6"
          #   django-version: "3.2"
          # python 3.7
          # - python-version: "3.7"
          #   django-version: "2.2"
          # - python-version: "3.7"
          #   django-version: "3.2"
          # python 3.8
          - python-version: "3.8"
            django-version: "2.2"
          - python-version: "3.8"
            django-version: "3.2"
          - python-version: "3.8"
            django-version: "4.2"
          # python 3.9
          - python-version: "3.9"
            django-version: "2.2"
          - python-version: "3.9"
            django-version: "3.2"
          - python-version: "3.9"
            django-version: "4.2"
          # python 3.10
          - python-version: "3.10"
            django-version: "2.2"
          - python-version: "3.10"
            django-version: "3.2"
          - python-version: "3.10"
            django-version: "4.2"
          - python-version: "3.10"
            django-version: "5.2"
          # python 3.11
          - python-version: "3.11"
            django-version: "2.2"
          - python-version: "3.11"
            django-version: "3.2"
          - python-version: "3.11"
            django-version: "4.2"
          - python-version: "3.11"
            django-version: "5.2"
          # python 3.12
          - python-version: "3.12"
            django-version: "2.2"
          - python-version: "3.12"
            django-version: "3.2"
          - python-version: "3.12"
            django-version: "4.2"
          - python-version: "3.12"
            django-version: "5.2"
          # # pypy3
          # - python-version: "pypy3"
          #   django-version: "2.2"
          # - python-version: "pypy3"
          #   django-version: "3.2"
          # - python-version: "pypy3"
          #   django-version: "4.2"
          # - python-version: "pypy3"
          #   django-version: "5.2"
    runs-on: ubuntu-20.04
    env:
      CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python version ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installing resources
        run: pip install --upgrade pip

      - name: Installing and entering to virtualenv
        run: |
          pip install virtualenv
          python -m venv venv
          source venv/bin/activate

      - name: Installing Requirements
        run: |
          pip install django==${{ matrix.django-version }}
          pip install pytest==7.1.1
          pytest --ds=testsettings

      # - name: Checking PEP8 code style
